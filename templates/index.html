{% extends "base.html" %}

{% block content %}
    <div x-data="{ open: false }">
        
        <h1 class="text-3xl font-bold text-slate-900 mb-8">User Management (CRUD)</h1>

        <form 
            hx-post="{% url 'create_user' %}" 
            hx-target="#user-list-container"
            hx-swap="innerHTML"
            hx-on::after-request="this.reset()" 
            class="bg-white p-6 rounded-lg shadow-md mb-8 border border-slate-200"
        >
            <h2 class="text-xl font-semibold mb-4 text-slate-700">Add New User</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" name="name" placeholder="Full Name" required 
                       class="border border-slate-300 p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                
                <select name="role" class="border border-slate-300 p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="Junior Developer">Junior Developer</option>
                    <option value="Senior Developer">Senior Developer</option>
                    <option value="DevOps Engineer">DevOps Engineer</option>
                </select>

                <button type="submit" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded hover:bg-indigo-700 transition flex items-center justify-center">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white htmx-indicator" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Create User
                </button>
            </div>
        </form>

        <div id="user-list-container">
            {% include "partials/_user_list.html" %}
        </div>
        
    </div>
{% endblock %}
