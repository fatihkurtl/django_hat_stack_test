<div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 fade-in">
    {% for user in users %}
    <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition border border-slate-200 relative group">
        
        <div class="flex items-center space-x-4">
            <div class="h-10 w-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold">
                {{ user.name|slice:":1" }}
            </div>
            <div>
                <h3 class="text-lg font-semibold text-slate-900">{{ user.name }}</h3>
                <p class="text-sm text-slate-500">{{ user.role }}</p>
            </div>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex justify-end space-x-2">
            
            <button 
                hx-patch="{% url 'update_user' user.id %}"
                hx-target="#user-list-container"
                class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded hover:bg-amber-200 transition"
            >
                Promote Role
            </button>

            <button 
                hx-delete="{% url 'delete_user' user.id %}"
                hx-target="#user-list-container"
                hx-confirm="Are you sure you want to delete {{ user.name }}?"
                class="text-xs bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200 transition"
            >
                Delete
            </button>

        </div>
    </div>
    {% empty %}
        <div class="col-span-3 text-center text-slate-400 py-12">
            No users found. Create one above!
        </div>
    {% endfor %}
</div>
